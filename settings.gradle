pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'IndustrialCraft2-CE'
include 'engine'
include 'api'

include 'neoforge'
project(':neoforge').projectDir = file('platform/neoforge')
