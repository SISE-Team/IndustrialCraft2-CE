plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

version = mod_version
group = mod_group_id
base { archivesName = mod_archive_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()
sourceSets.main.java.setSrcDirs([])
sourceSets.main.resources.setSrcDirs([])

evaluationDependsOn(':engine')
evaluationDependsOn(':api')
evaluationDependsOn(':neoforge')
def runtimeModules = [project(':engine'), project(':api'), project(':neoforge')]

// The root assembles one mod. Each implementation module owns its compiler and dependencies.
tasks.named('jar') {
    runtimeModules.each { module -> dependsOn module.tasks.named('classes'); from module.sourceSets.main.output }
}
tasks.named('sourcesJar') { runtimeModules.each { module -> from module.sourceSets.main.allSource } }
tasks.named('check') { runtimeModules.each { module -> dependsOn module.tasks.named('check') } }
tasks.withType(Jar).configureEach {
    archiveVersion = minecraft_version + '-' + mod_version
    manifest.attributes('Implementation-Title': mod_name, 'Implementation-Version': mod_version)
    from(['LICENSE', 'NOTICE']) { into 'META-INF/licenses' }
    from('licenses') { into 'META-INF/licenses' }
}
tasks.register('migrationVerificationJar', Jar) {
    dependsOn project(':neoforge').tasks.named('migrationVerificationClasses')
    archiveClassifier = 'verification'
    from(project(':neoforge').sourceSets.main.output) { exclude 'data/forge/tags/fluid/steam.json' }
    from project(':neoforge').sourceSets.migrationVerification.output
    from project(':engine').sourceSets.main.output
    from project(':api').sourceSets.main.output
}
['runClient', 'runServer', 'runGameTestServer'].each { name -> tasks.register(name) { dependsOn ":neoforge:$name" } }
