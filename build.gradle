plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

version = mod_version
group = mod_group_id
base { archivesName = mod_archive_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()
sourceSets.main.java.setSrcDirs([])
sourceSets.main.resources.setSrcDirs([])

evaluationDependsOn(':engine')
evaluationDependsOn(':api')
evaluationDependsOn(':neoforge')
def runtimeModules = [project(':engine'), project(':api'), project(':neoforge')]

// Original media is the main-branch release policy. Draft artwork lives in a
// separate local worktree and must never leak into resource or source JARs.
tasks.register('verifyOriginalArt') {
    def manifestFile = file('validation/original-art.json')
    def resourceRoot = file('assets/src/main/resources')
    def media = fileTree(resourceRoot) { include '**/*.png', '**/*.mcmeta', '**/*.ogg' }
    def drafts = fileTree(resourceRoot) {
        include '**/*-art-manifest.json', '**/nuclear-marking-manifest.json'
        include '**/textures/block/ce/**', '**/textures/item/ce/**'
    }
    inputs.file(manifestFile)
    inputs.files(media, drafts)
    doLast {
        def expected = new groovy.json.JsonSlurper().parse(manifestFile).files
        def actual = media.files.collectEntries { path ->
            [(resourceRoot.toPath().relativize(path.toPath()).toString().replace('\\', '/')): path]
        }
        if (actual.keySet() != expected.keySet() || !drafts.isEmpty())
            throw new GradleException('Release resources contain missing media or temporary artwork.')
        def changed = actual.findAll { path, source ->
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes)
            java.util.HexFormat.of().formatHex(digest) != expected[path]
        }.keySet()
        if (changed) throw new GradleException('Original IC2 media changed: ' + changed.join(', '))
        logger.lifecycle('IC2_ORIGINAL_ART_VERIFY files={} temporary_artwork=0', actual.size())
    }
}

// The root assembles one mod. Each implementation module owns its compiler and dependencies.
tasks.named('jar') {
    runtimeModules.each { module -> dependsOn module.tasks.named('classes'); from module.sourceSets.main.output }
}
tasks.named('sourcesJar') { runtimeModules.each { module -> from module.sourceSets.main.allSource } }
tasks.named('check') { runtimeModules.each { module -> dependsOn module.tasks.named('check') } }

// Dependencies point one way: engine -> api -> neoforge. Qualified names count, not only imports.
def layering = [
    'engine/src/main/java': ['net.minecraft', 'net.neoforged', 'com.mojang', 'ic2ce.api', 'ic2ce.core', 'ic2ce.neoforge'],
    'engine/src/test/java': ['net.minecraft', 'net.neoforged', 'com.mojang', 'ic2ce.api', 'ic2ce.core', 'ic2ce.neoforge'],
    'api/src/main/java': ['ic2ce.core', 'ic2ce.neoforge'],
    // The legacy core namespace is dissolved into domain packages and must not return.
    'platform/neoforge/src/main/java': ['ic2ce.core'],
    'verification/src/main/java': ['ic2ce.core'],
]
tasks.register('checkLayering') {
    def roots = layering.collectEntries { root, banned -> [(file(root)): banned] }
    roots.keySet().each { inputs.dir(it) }
    doLast {
        def violations = []
        roots.each { root, banned ->
            def pattern = ~('(?<![\\w.])(' + banned.collect { java.util.regex.Pattern.quote(it) }.join('|') + ')\\.')
            root.eachFileRecurse(groovy.io.FileType.FILES) { source ->
                if (!source.name.endsWith('.java')) return
                source.readLines('UTF-8').eachWithIndex { line, index ->
                    if (line.trim().startsWith('//') || line.trim().startsWith('*')) return
                    def match = pattern.matcher(line)
                    if (match.find()) violations << "${rootDir.toPath().relativize(source.toPath())}:${index + 1} uses ${match.group(1)}"
                }
            }
        }
        if (violations) throw new GradleException('Layering violations:\n' + violations.join('\n'))
    }
}
tasks.named('check') { dependsOn 'checkLayering' }
tasks.withType(Jar).configureEach {
    dependsOn tasks.named('verifyOriginalArt')
    archiveVersion = minecraft_version + '-' + mod_version
    manifest.attributes('Implementation-Title': mod_name, 'Implementation-Version': mod_version)
    from(['LICENSE', 'NOTICE']) { into 'META-INF/licenses' }
    from('licenses') { into 'META-INF/licenses' }
}
tasks.register('migrationVerificationJar', Jar) {
    dependsOn project(':neoforge').tasks.named('migrationVerificationClasses')
    archiveClassifier = 'verification'
    from(project(':neoforge').sourceSets.main.output) { exclude 'data/forge/tags/fluid/steam.json' }
    from project(':neoforge').sourceSets.migrationVerification.output
    from project(':engine').sourceSets.main.output
    from project(':api').sourceSets.main.output
}
['runClient', 'runServer', 'runGameTestServer'].each { name -> tasks.register(name) { dependsOn ":neoforge:$name" } }
